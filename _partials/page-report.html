<aside class="page-report" aria-labelledby="page-report-h">
  <div class="wrap page-report-inner">
    <div class="page-report-copy">
      <p class="page-report-h" id="page-report-h">{{report_h}}</p>
      <p class="page-report-sub">{{report_sub}} Send it to <a href="mailto:{{support_email}}">{{support_email}}</a>; the button fills in which page you are on.</p>
    </div>
    <a class="page-report-btn" href="{{report_mail}}">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 21V4"></path><path d="M5 4h9.5l-1.4 3.6L14.5 12H5z"></path>
      </svg>
      <span>Report an error</span>
    </a>
  </div>
</aside>
