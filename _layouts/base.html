<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0B1020">
<meta name="color-scheme" content="dark">

<link rel="alternate" hreflang="en" href="{{canonical}}">
<link rel="alternate" hreflang="x-default" href="{{canonical}}">

<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base_url}}/images/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="InoxTV IPTV player for Android TV, Fire TV and mobile">
<meta property="og:site_name" content="InoxTV">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base_url}}/images/og-image.jpg">

<link rel="icon" type="image/png" href="/images/mobile-icon.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="manifest" href="/manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Outfit:wght@600..700&display=swap">
<link rel="stylesheet" href="/docs.css">

<script async src="https://www.googletagmanager.com/gtag/js?id={{analytics_id}}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{analytics_id}}');
</script>
{{ads_loader}}
{{jsonld}}
</head>
<body class="{{body_class}}">
<a href="#main" class="skip-link">Skip to main content</a>
{% include nav %}
<main id="main">
{{content}}
</main>
{% include footer %}
<script src="/docs.js" defer></script>
</body>
</html>
