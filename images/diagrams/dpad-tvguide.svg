<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img"
     aria-labelledby="dpadGuideTitle dpadGuideDesc" width="980" height="460">
  <title id="dpadGuideTitle">InoxTV Android TV remote D-pad — default TV guide controls</title>
  <desc id="dpadGuideDesc">A television remote D-pad as it behaves in the TV guide. Up and Down move the selection one channel at a time and are not in the remappable list. Right scrolls the time axis to the next programmes. Left shows the groups panel. OK opens the selected channel and held opens the channel options menu. Only OK has a hold action assigned by default.</desc>

  <style>
    .d-svg {
      --ink:      #E9EEF8;
      --strong:   #FFFFFF;
      --muted:    #9AA7BE;
      --surface:  #161B2A;
      --pad:      #1E2540;
      --pad-edge: #2E3654;
      --ok:       #262E4C;
      --line:     #262E4C;
      --blue:     #3B82F6;
      --hold:     #F2C879;
      --chip-ink: #FFFFFF;
    }
    .d-svg text { font-family: Outfit, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pad-ring   { fill: var(--pad);     stroke: var(--pad-edge); stroke-width: 2; }
    .pad-ok     { fill: var(--ok);      stroke: var(--pad-edge); stroke-width: 2; }
    .pad-split  { stroke: var(--pad-edge); stroke-width: 1.5; }
    .arrow      { fill: var(--muted); }
    .chip       { fill: var(--blue); }
    .chip-num   { fill: var(--chip-ink); font-size: 19px; font-weight: 700; text-anchor: middle; }
    .ok-label   { fill: var(--strong); font-size: 21px; font-weight: 700; text-anchor: middle; letter-spacing: .06em; }
    .col-head   { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    .key-name   { fill: var(--strong); font-size: 16px; font-weight: 700; }
    .press      { fill: var(--ink); font-size: 15px; }
    .hold       { fill: var(--hold); font-size: 15px; }
    /* no hold action assigned, or a key that is not remappable at all */
    .hold--off  { fill: var(--muted); font-size: 15px; }
    .foot       { fill: var(--muted); font-size: 12.5px; }
    .row-line   { stroke: var(--line); stroke-width: 1; }
  </style>

  <g class="d-svg">
    <rect x="0" y="0" width="980" height="460" fill="var(--surface)"/>

    <!-- ============ D-PAD ============ -->
    <circle class="pad-ring" cx="230" cy="240" r="140"/>

    <!-- segment separators (45deg, from OK edge to outer edge) -->
    <line class="pad-split" x1="273.8" y1="196.2" x2="329" y2="141"/>
    <line class="pad-split" x1="186.2" y1="196.2" x2="131" y2="141"/>
    <line class="pad-split" x1="186.2" y1="283.8" x2="131" y2="339"/>
    <line class="pad-split" x1="273.8" y1="283.8" x2="329" y2="339"/>

    <!-- direction arrows -->
    <path class="arrow" d="M230 125 L213 153 L247 153 Z"/>
    <path class="arrow" d="M230 355 L213 327 L247 327 Z"/>
    <path class="arrow" d="M115 240 L143 223 L143 257 Z"/>
    <path class="arrow" d="M345 240 L317 223 L317 257 Z"/>

    <!-- centre OK button -->
    <circle class="pad-ok" cx="230" cy="240" r="62"/>
    <circle class="chip" cx="230" cy="216" r="14"/>
    <text class="chip-num" x="230" y="223">5</text>
    <text class="ok-label" x="230" y="262">OK</text>

    <!-- numbered chips around the pad -->
    <circle class="chip" cx="230" cy="70" r="18"/>
    <text class="chip-num" x="230" y="77">1</text>

    <circle class="chip" cx="400" cy="240" r="18"/>
    <text class="chip-num" x="400" y="247">2</text>

    <circle class="chip" cx="230" cy="410" r="18"/>
    <text class="chip-num" x="230" y="417">3</text>

    <circle class="chip" cx="60" cy="240" r="18"/>
    <text class="chip-num" x="60" y="247">4</text>

    <!-- ============ LEGEND ============ -->
    <text class="col-head" x="452" y="52">KEY</text>
    <text class="col-head" x="560" y="52">PRESS</text>
    <text class="col-head" x="770" y="52">HOLD</text>

    <line class="row-line" x1="450" y1="70"  x2="950" y2="70"/>
    <line class="row-line" x1="450" y1="138" x2="950" y2="138"/>
    <line class="row-line" x1="450" y1="206" x2="950" y2="206"/>
    <line class="row-line" x1="450" y1="274" x2="950" y2="274"/>
    <line class="row-line" x1="450" y1="342" x2="950" y2="342"/>
    <line class="row-line" x1="450" y1="410" x2="950" y2="410"/>

    <!-- row 1 : Up -->
    <circle class="chip" cx="468" cy="104" r="14"/>
    <text class="chip-num" x="468" y="111">1</text>
    <text class="key-name" x="492" y="110">Up *</text>
    <text class="press"    x="560" y="110">Move selection up</text>
    <text class="hold--off" x="770" y="110">&#8212;</text>

    <!-- row 2 : Right -->
    <circle class="chip" cx="468" cy="172" r="14"/>
    <text class="chip-num" x="468" y="179">2</text>
    <text class="key-name" x="492" y="178">Right</text>
    <text class="press"    x="560" y="178">Next programs</text>
    <text class="hold--off" x="770" y="178">&#8212;</text>

    <!-- row 3 : Down -->
    <circle class="chip" cx="468" cy="240" r="14"/>
    <text class="chip-num" x="468" y="247">3</text>
    <text class="key-name" x="492" y="246">Down *</text>
    <text class="press"    x="560" y="246">Move selection down</text>
    <text class="hold--off" x="770" y="246">&#8212;</text>

    <!-- row 4 : Left -->
    <circle class="chip" cx="468" cy="308" r="14"/>
    <text class="chip-num" x="468" y="315">4</text>
    <text class="key-name" x="492" y="314">Left</text>
    <text class="press"    x="560" y="314">Groups panel</text>
    <text class="hold--off" x="770" y="314">&#8212;</text>

    <!-- row 5 : OK -->
    <circle class="chip" cx="468" cy="376" r="14"/>
    <text class="chip-num" x="468" y="383">5</text>
    <text class="key-name" x="492" y="382">OK</text>
    <text class="press"    x="560" y="382">Open channel</text>
    <text class="hold"     x="770" y="382">Channel options</text>

    <!-- the guide leaves four of the five holds unassigned, which is worth stating -->
    <text class="foot" x="450" y="432">* Grid navigation &#8212; not in the remappable list.</text>
    <text class="foot" x="450" y="450">&#8212; no hold action assigned by default.</text>
  </g>
</svg>
